<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Releasetrain Dashboard</title>
    <style>
        p {
            background-color: #202020;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            font-size: 18px;
            flex-direction: column;
            align-items: center;
            font-style: italic;
        }
        /* .header {
            margin-top: 20px;
            text-align: center;
        } */
        .github-button-container {
            position: fixed;
            top: 1px;
            right: 1px;
            z-index: 999;
        }
        .github-button {
            background-color: #24292e;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 12px;
        }
        .github-button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div class="github-button-container">
        <button class="github-button" onclick="window.open('https://github.com/sam-uop/BigDataWebPerformance', '_blank')">View on GitHub</button>
    </div>
    <div class="header">
        <!-- <h1>Releasetrain Dashboard</h1> -->
        <p>Please enter a software component and pick one. Our goal is to make it fast by adding the React framework.</p>
    </div>
    <div id="app"></div>
</body>
</html>
